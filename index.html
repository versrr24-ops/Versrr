<title>Versrr — Peer-verified P2P crypto</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

<style>
/* Versrr design tokens — dark (default) */
:root, [data-theme="dark"] {
  /* Brand — Versrr purple */
  --brand-900: #3B2659;
  --brand-800: #4A2F6F;
  --brand-700: #5b3c88;
  --brand-600: #6E4AA3;
  --brand-500: #7F5CB6;
  --brand-400: #9B7DC9;
  --brand-300: #BCA5DB;

  /* Legacy purple aliases — remap to brand for any residual references */
  --purple-900: var(--brand-900);
  --purple-800: var(--brand-800);
  --purple-700: var(--brand-700);
  --purple-600: var(--brand-600);
  --violet-400: var(--brand-400);

  /* Surfaces */
  --bg-0: #0B0910;
  --bg-1: #141220;
  --bg-2: #1C1A2B;
  --bg-3: #272238;
  --bg-4: #332C46;

  /* Text */
  --fg-0: #F7F6FB;
  --fg-1: #CFCBDC;
  --fg-2: #9690AD;
  --fg-3: #6D6780;
  --fg-4: #4B4660;

  /* Borders */
  --border-1: #26223A;
  --border-2: #363150;
  --border-focus: var(--brand-700);

  /* Semantic — buy/sell harmonized with brand purple (cooler green, warmer red) */
  --buy-500: #1E9E6A;
  --buy-600: #168A5A;
  --buy-400: #3FB383;
  --buy-bg: rgba(30, 158, 106, 0.14);
  --buy-border: rgba(30, 158, 106, 0.38);

  --sell-500: #D4354F;
  --sell-600: #B92942;
  --sell-400: #E55A70;
  --sell-bg: rgba(212, 53, 79, 0.14);
  --sell-border: rgba(212, 53, 79, 0.38);

  --success: var(--buy-500);
  --success-bg: var(--buy-bg);
  --error: var(--sell-500);
  --error-bg: var(--sell-bg);
  --warning: #C9932E;
  --warning-bg: rgba(201, 147, 46, 0.12);
  --info-bg: rgba(91, 60, 136, 0.14);

  /* Radii */
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 18px; --r-2xl: 24px;

  /* Shadows — flat, no tinted glows */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.5);

  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  color-scheme: dark;
}

/* ---------- Light mode ---------- */
[data-theme="light"] {
  --brand-900: #2F1E47;
  --brand-800: #3E285C;
  --brand-700: #5b3c88;
  --brand-600: #6E4AA3;
  --brand-500: #8564B8;
  --brand-400: #A788CE;
  --brand-300: #C7AFDE;

  --purple-900: var(--brand-900);
  --purple-800: var(--brand-800);
  --purple-700: var(--brand-700);
  --purple-600: var(--brand-600);
  --violet-400: var(--brand-600);

  --bg-0: #F6F4FA;
  --bg-1: #FFFFFF;
  --bg-2: #FFFFFF;
  --bg-3: #F1EDF7;
  --bg-4: #E6E0EF;

  --fg-0: #1A1428;
  --fg-1: #3E3655;
  --fg-2: #6B6483;
  --fg-3: #8C84A3;
  --fg-4: #B6AFC7;

  --border-1: #E5DFEE;
  --border-2: #D2CADF;

  --buy-500: #158A57;
  --buy-600: #0F6F45;
  --buy-400: #1FA86B;
  --buy-bg: rgba(21, 138, 87, 0.10);
  --buy-border: rgba(21, 138, 87, 0.30);

  --sell-500: #BF2442;
  --sell-600: #A01A35;
  --sell-400: #D34761;
  --sell-bg: rgba(191, 36, 66, 0.08);
  --sell-border: rgba(191, 36, 66, 0.30);

  --success: var(--buy-500);
  --success-bg: var(--buy-bg);
  --error: var(--sell-500);
  --error-bg: var(--sell-bg);
  --warning: #B47D1B;
  --warning-bg: rgba(180, 125, 27, 0.10);
  --info-bg: rgba(91, 60, 136, 0.08);

  --shadow-sm: 0 1px 2px rgba(20, 12, 40, 0.06);
  --shadow-md: 0 4px 16px rgba(20, 12, 40, 0.08);
  --shadow-lg: 0 12px 40px rgba(20, 12, 40, 0.12);

  color-scheme: light;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-0);
  color: var(--fg-0);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: 'cv11', 'ss01', 'ss03';
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; color: inherit; }
a { color: var(--violet-400); text-decoration: none; }

/* Money/numbers */
.mono, .money { font-family: var(--font-mono); font-feature-settings: 'tnum', 'zero'; letter-spacing: -0.01em; }

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--fg-4); }

/* Shared component utilities */
.card {
  background: var(--bg-2);
  border: 1px solid var(--border-1);
  border-radius: var(--r-lg);
  padding: 16px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 20px;
  border-radius: var(--r-md);
  font-weight: 600;
  font-size: 14px;
  transition: all 0.15s ease;
  white-space: nowrap;
  user-select: none;
}
.btn-brand, .btn-amber { background: var(--brand-700); color: #fff; }
.btn-brand:hover, .btn-amber:hover { background: var(--brand-600); transform: translateY(-1px); }
.btn-brand:active, .btn-amber:active { transform: translateY(0); }
.btn-purple { background: var(--brand-800); color: #fff; }
.btn-purple:hover { background: var(--brand-700); }
.btn-buy { background: var(--buy-500); color: #fff; }
.btn-buy:hover { background: var(--buy-600); transform: translateY(-1px); }
.btn-buy:active { transform: translateY(0); }
.btn-sell { background: var(--sell-500); color: #fff; }
.btn-sell:hover { background: var(--sell-600); transform: translateY(-1px); }
.btn-sell:active { transform: translateY(0); }
.btn-outline { border: 1px solid var(--border-2); color: var(--fg-1); background: transparent; }
.btn-outline:hover { border-color: var(--fg-3); background: var(--bg-3); }
.btn-ghost { color: var(--fg-1); }
.btn-ghost:hover { background: var(--bg-3); }
.btn-red { background: var(--error); color: #fff; }
.btn-red:hover { filter: brightness(1.08); }
.btn-sm { padding: 8px 14px; font-size: 13px; }
.btn-xs { padding: 6px 10px; font-size: 12px; border-radius: 6px; }
.btn-full { width: 100%; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

.input {
  width: 100%;
  background: var(--bg-1);
  border: 1px solid var(--border-1);
  border-radius: var(--r-md);
  padding: 12px 14px;
  font-size: 14px;
  color: var(--fg-0);
  outline: none;
  transition: border-color 0.15s;
}
.input:focus { border-color: var(--brand-700); box-shadow: 0 0 0 3px rgba(91, 60, 136, 0.20); }
.input::placeholder { color: var(--fg-3); }

label.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 500; }
label.field .input, label.field select, label.field textarea { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--fg-0); }

/* Tier colors for verification */
.tier-new { --tier-bg: rgba(107, 114, 128, 0.15); --tier-fg: #9CA3AF; --tier-border: #374151; }
.tier-peer { --tier-bg: rgba(91, 60, 136, 0.14); --tier-fg: var(--brand-400); --tier-border: rgba(91, 60, 136, 0.40); }
.tier-vendor { --tier-bg: rgba(91, 60, 136, 0.14); --tier-fg: var(--brand-300); --tier-border: rgba(91, 60, 136, 0.40); }
.tier-trusted { --tier-bg: rgba(91, 60, 136, 0.22); --tier-fg: #E9D5FF; --tier-border: rgba(155, 125, 201, 0.55); }

/* Shimmer */
@keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
.skeleton { background: var(--bg-3); animation: shimmer 1.6s infinite; border-radius: 8px; opacity: 0.7; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.25s ease-out; }

@keyframes slideInTop { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
.slide-in-top { animation: slideInTop 0.3s ease-out; }

@keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.pulse-dot { animation: pulse-dot 1.4s infinite; }

/* Layout */
.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-rows: 1fr;
  padding-top: 56px;
}
@media (min-width: 1024px) {
  .app-shell {
    grid-template-columns: 240px 1fr;
    grid-template-rows: 1fr;
  }
  .app-shell .topbar { grid-column: 1 / -1; }
  .app-shell .sidebar { display: flex !important; }
  .app-shell .bottomnav { display: none !important; }
  .app-shell .main { grid-column: 2; }
}

.topbar {
  grid-column: 1 / -1;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 30;
  background: #5b3c88;
  border-bottom: none;
  height: 56px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 16px;
}
[data-theme="light"] .topbar {
  background: #ffffff;
  border-bottom: 1px solid var(--border-1);
}

.main {
  padding: 16px;
  padding-bottom: 96px;
  max-width: 100%;
  overflow-x: hidden;
}
@media (min-width: 1024px) {
  .main { padding: 24px 32px; padding-bottom: 48px; max-width: 1200px; }
}

.bottomnav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  height: 72px;
  background: #5b3c88;
  border-top: none;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
[data-theme="light"] .bottomnav {
  background: #ffffff;
  border-top: 1px solid var(--border-1);
}

.sidebar {
  display: none;
  flex-direction: column;
  gap: 4px;
  padding: 16px;
  border-right: 1px solid var(--border-1);
  background: #5b3c88;
  height: calc(100vh - 56px);
  position: sticky;
  top: 56px;
}
[data-theme="light"] .sidebar {
  background: #ffffff;
}

.flex { display: flex; }
.flex-col { display: flex; flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-1 { gap: 4px; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-6 { gap: 24px; }
.grid { display: grid; }
.w-full { width: 100%; }
.text-xs { font-size: 11px; }
.text-sm { font-size: 13px; }
.text-base { font-size: 14px; }
.text-lg { font-size: 16px; }
.text-xl { font-size: 20px; }
.text-2xl { font-size: 24px; }
.text-3xl { font-size: 32px; }
.text-4xl { font-size: 40px; }
.font-semibold { font-weight: 600; }
.font-bold { font-weight: 700; }
.muted { color: var(--fg-2); }
.muted-2 { color: var(--fg-3); }
.uppercase { text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; }

    <div style={{

      padding: compact ? 12 : 16,

};

// ---------- Avatar ----------
const Avatar = ({ name, size = 36, tier }) => {
  const initials = (name || '?').split(' ').map(s => s[0]).join('').slice(0, 2).toUpperCase();
  const hue = (name || '').split('').reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
  return (
    <div style={{
      width: size, height: size, borderRadius: 999,
      background: `hsl(${hue} 30% 40%)`,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontSize: size * 0.36, fontWeight: 700, color: 'white', flexShrink: 0,
      border: tier === 'trusted' ? '2px solid rgba(167,139,250,0.6)' : 'none',

};
const MethodChip = ({ method }) => (

    display: 'inline-flex', alignItems: 'center', gap: 4,
    padding: '3px 8px', borderRadius: 6,
    fontSize: 11, fontWeight: 500,

    border: '1px solid var(--border-1)',
  }}>
    <span style={{width: 6, height: 6, borderRadius: 2, background: METHOD_COLORS[method] || '#6B7280'}} />
    {method}
  </span>
);

// ---------- Toast ----------
const useToast = () => {
  const [toasts, setToasts] = useState([]);
  const show = (msg, kind = 'info') => {
    const id = Math.random();
    setToasts(t => [...t, { id, msg, kind }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  };
  const ToastHost = () => (
    <div style={{position: 'fixed', top: 72, left: 0, right: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8, zIndex: 100, pointerEvents: 'none'}}>
      {toasts.map(t => (
        <div key={t.id} className="slide-in-top" style={{
          background: 'var(--bg-3)',
          border: '1px solid var(--border-2)',
          borderLeft: `3px solid ${t.kind === 'success' ? 'var(--success)' : t.kind === 'error' ? 'var(--error)' : 'var(--purple-700)'}`,
          borderRadius: 10, padding: '10px 16px', fontSize: 13, color: 'var(--fg-0)',
          boxShadow: 'var(--shadow-lg)', maxWidth: 340, pointerEvents: 'auto',
        }}>
          {t.msg}
        </div>
      ))}
    </div>
  );
  return { show, ToastHost };
};

// ---------- Modal ----------
const Modal = ({ open, onClose, children, title, size = 'md' }) => {
  if (!open) return null;
  const maxWidth = size === 'sm' ? 360 : size === 'lg' ? 560 : 440;
  return (
    <div onClick={onClose} style={{
      position: 'fixed', inset: 0, zIndex: 60,
      background: 'rgba(0,0,0,0.7)', backdropFilter: 'blur(4px)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: 16,
    }}>
      <div onClick={e => e.stopPropagation()} className="fade-in" style={{
        background: 'var(--bg-2)', border: '1px solid var(--border-1)',
        borderRadius: 20, padding: 24, width: '100%', maxWidth,
        maxHeight: '90vh', overflow: 'auto',
      }}>
        {title && (
          <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16}}>
            <h3 style={{margin: 0, fontSize: 18, fontWeight: 600}}>{title}</h3>
            <button onClick={onClose} className="btn-ghost" style={{padding: 6, borderRadius: 8, display: 'flex'}}><Icon name="x" size={18} /></button>
          </div>
        )}
        {children}
      </div>
    </div>
  );
};

// ---------- Toggle / SegmentedControl ----------
const Segmented = ({ value, onChange, options, full = false, accent = 'brand' }) => (
  <div style={{
    display: 'inline-flex', padding: 4, borderRadius: 10,
    background: 'var(--bg-1)', border: '1px solid var(--border-1)',
    width: full ? '100%' : 'auto',
  }}>
    {options.map(o => {
      const active = value === o.value;
      return (
        <button key={o.value} onClick={() => onChange(o.value)} style={{
          flex: full ? 1 : 'none',
          padding: '8px 16px', borderRadius: 7, fontSize: 13, fontWeight: 600,
          background: active ? (accent === 'sell' ? 'var(--sell-500)' : accent === 'buy' ? 'var(--buy-500)' : 'var(--brand-700)') : 'transparent',
          color: active ? ('#ffffff') : 'var(--fg-2)',
          transition: 'all 0.15s',
        }}>{o.label}</button>
      );
    })}
  </div>
);

// ---------- Empty state ----------
const EmptyState = ({ icon = 'info', title, body, cta }) => (
  <div style={{
    padding: '48px 20px', textAlign: 'center',
    display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12,
  }}>
    <div style={{
      width: 56, height: 56, borderRadius: 16,
      background: 'var(--bg-2)', border: '1px solid var(--border-1)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      color: 'var(--fg-3)',
    }}><Icon name={icon} size={24} /></div>
    <div>
      <div style={{fontWeight: 600, marginBottom: 4}}>{title}</div>
      <div style={{color: 'var(--fg-2)', fontSize: 13}}>{body}</div>
    </div>
    {cta}
  </div>
);

// ---------- Copy button ----------
const CopyButton = ({ text, label = 'Copy', onCopy }) => {
  const [copied, setCopied] = useState(false);
  return (
    <button className="btn btn-outline btn-sm" onClick={() => {
      try { navigator.clipboard.writeText(text); } catch(e) {}
      setCopied(true);
      onCopy && onCopy();
      setTimeout(() => setCopied(false), 1500);
    }}>
      <Icon name={copied ? 'check' : 'copy'} size={14} />
      {copied ? 'Copied' : label}
    </button>
  );
};

// Export everything to window
Object.assign(window, { Icon, VMark, VerBadge, VerCard, Avatar, MethodChip, useToast, Modal, Segmented, EmptyState, CopyButton, TIERS, METHOD_COLORS });

</script>

// ---------- Page Header (with back btn) ----------

// ---------- P2P page ----------

  'Bank Transfer','Opay','Kuda','PalmPay','Moniepoint','GTBank','Access Bank','First Bank',
  'PayPal','Wise','Revolut','Cash App','Zelle','Venmo','Payoneer',

  'SEPA','Faster Payments','iDEAL','BLIK',
  'Bitcoin (BTC)','Ethereum (ETH)','BNB','XRP','Solana (SOL)','USDC (on-chain)',

const CURRENCIES = [

  {code:'USD',symbol:'$',name:'US Dollar'},

  {code:'GHS',symbol:'GH₵',name:'Ghanaian Cedi'},

Object.assign(window, { P2PPage, CreateOfferPage, OfferCard });

<script type="text/babel" data-file="src/trade.jsx" data-plugins="transform-react-jsx-source" data-filename="inline-3">
const { useState: useStateT, useEffect: useEffectT, useMemo: useMemoT, useRef: useRefT } = React;

// Trade status states
const TRADE_STATES = ['opened', 'active', 'paid', 'verified', 'complete'];
const TRADE_LABELS = { opened: 'Opened', active: 'Active', paid: 'Paid', verified: 'Verified', complete: 'Complete' };

// ---------- Status stepper ----------
const TradeStatus = ({ state }) => {
  const activeIdx = TRADE_STATES.indexOf(state);
  return (
    <div style={{display: 'flex', alignItems: 'center', gap: 4, padding: '12px 4px'}}>
      {TRADE_STATES.map((s, i) => {
        const done = i < activeIdx;
        const active = i === activeIdx;
        const color = done ? 'var(--success)' : active ? 'var(--violet-400)' : 'var(--fg-4)';
        return (
          <React.Fragment key={s}>
            <div style={{display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, flex: '0 0 auto', minWidth: 56}}>
              <div style={{
                width: 24, height: 24, borderRadius: 999,
                background: done ? 'var(--success)' : active ? 'rgba(91,60,136,0.22)' : 'var(--bg-3)',
                border: `1.5px solid ${color}`,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                color: done ? 'white' : color,
              }}>
                {done ? <Icon name="check" size={12} stroke={3} /> : <span style={{fontSize: 10, fontWeight: 700}}>{i+1}</span>}
              </div>
              <span style={{fontSize: 10, color, fontWeight: active ? 600 : 500, textAlign: 'center'}}>{TRADE_LABELS[s]}</span>
            </div>
            {i < TRADE_STATES.length - 1 && <div style={{flex: 1, height: 2, background: done ? 'var(--success)' : 'var(--border-1)', marginBottom: 20, minWidth: 8}} />}
          </React.Fragment>
        );
      })}
    </div>
  );
};

// ---------- Countdown timer ----------
const useCountdown = (seconds, onEnd) => {
  const [left, setLeft] = useStateT(seconds);
  useEffectT(() => { setLeft(seconds); }, [seconds]);
  useEffectT(() => {
    if (left <= 0) { onEnd && onEnd(); return; }
    const t = setTimeout(() => setLeft(l => l - 1), 1000);
    return () => clearTimeout(t);
  }, [left]);
  const m = Math.floor(Math.max(0,left) / 60), s = Math.max(0,left) % 60;
  return `${m}:${s.toString().padStart(2,'0')}`;
};

// ---------- Trade chat ----------
const TradeChat = ({ messages, onSend, vendor }) => {
  const [open, setOpen] = useStateT(false);
  const [msg, setMsg] = useStateT('');
  return (
    <div className="card" style={{padding: 0, overflow: 'hidden'}}>

          <Icon name="message" size={18} />

                <div style={{
                  maxWidth: '78%', padding: '8px 12px', borderRadius: 12,
                  background: m.me ? 'var(--purple-800)' : 'var(--bg-3)',
                  color: m.me ? 'white' : 'var(--fg-0)',

                }}>

          </div>

            <button className="btn btn-purple" onClick={()=>{if(msg){onSend(msg); setMsg('');}}}>Send</button>
          </div>
          <div style={{display: 'flex', gap: 8}}>
            <button className="btn btn-outline btn-sm" style={{flex: 1}}><Icon name="whatsapp" size={14} />WhatsApp</button>
            <button className="btn btn-outline btn-sm" style={{flex: 1}}><Icon name="telegram" size={14} />Telegram</button>
          </div>
        </div>
      )}
    </div>
  );
};

// ---------- Trade page ----------
const TradePage = ({ trade, role, onBack, onAdvance, onCancel, onDispute, toast }) => {
  const { vendor, amount, direction, state } = trade;
  const rate = direction === 'buy' ? vendor.rateBuy : vendor.rateSell;
  const totalFiat = amount * rate;
  const [messages, setMessages] = useStateT([
    { me: false, text: 'Hi, I\'ll send the details once you\'ve opened. Please only pay from your own account.', when: '2m ago' },
  ]);
  const [verifyOpen, setVerifyOpen] = useStateT(false);
  const [showKYC, setShowKYC] = useStateT(false);

  const timerOpened = useCountdown(state === 'opened' ? 287 : 0);
  const timerPaid = useCountdown(state === 'paid' ? 432 : 0);

  const isBuyer = role === 'buyer';

  const sendMsg = (t) => setMessages(m => [...m, { me: true, text: t, when: 'now' }]);

  return (
    <div className="fade-in" style={{maxWidth: 720}}>
      <PageHeader
        title={`Trade TR-${Math.floor(Math.random()*9000+1000)}`}
        subtitle={<span>{isBuyer ? 'Buying' : 'Selling'} <span className="mono">${amount}</span> {direction === 'buy' ? 'from' : 'to'} {vendor.name}</span>}
        back={onBack}
        actions={<span style={{fontSize: 11, padding: '4px 10px', borderRadius: 6, background: 'var(--bg-2)', color: 'var(--fg-2)', border: '1px solid var(--border-1)'}}>{isBuyer ? 'Buyer view' : 'Vendor view'}</span>}

        <TradeStatus state={state} />
      </div>

      <div style={{display: 'grid', gap: 12, gridTemplateColumns: 'minmax(0, 1fr)'}}>
        {/* Timer banner */}
        {state === 'opened' && (
          <div style={{padding: 14, borderRadius: 12, background: 'var(--warning-bg)', border: '1px solid rgba(201,147,46,0.35)', display: 'flex', alignItems: 'center', gap: 10}}>
            <Icon name="clock" size={18} stroke={2} />
            <div style={{flex: 1}}>
              <div style={{fontWeight: 600, fontSize: 13}}>Waiting for vendor to engage</div>
              <div style={{fontSize: 12, color: 'var(--fg-2)'}}>Response window expires in <span className="mono" style={{color: 'var(--fg-0)', fontWeight: 600}}>{timerOpened}</span></div>
            </div>
          </div>
        )}
        {state === 'paid' && (
          <div style={{padding: 14, borderRadius: 12, background: 'rgba(91,60,136,0.10)', border: '1px solid rgba(91,60,136,0.35)', display: 'flex', alignItems: 'center', gap: 10}}>
            <Icon name="clock" size={18} stroke={2} />
            <div style={{flex: 1}}>
              <div style={{fontWeight: 600, fontSize: 13}}>{isBuyer ? 'Awaiting vendor verification' : 'Buyer marked as paid'}</div>
              <div style={{fontSize: 12, color: 'var(--fg-2)'}}>Vendor has <span className="mono" style={{color: 'var(--violet-400)', fontWeight: 600}}>{timerPaid}</span> to verify and release</div>
            </div>
          </div>
        )}
        {state === 'complete' && (
          <div style={{padding: 16, borderRadius: 12, background: 'rgba(16,185,129,0.1)', border: '1px solid rgba(16,185,129,0.3)', display: 'flex', alignItems: 'center', gap: 12}}>
            <div style={{width: 36, height: 36, borderRadius: 999, background: 'var(--success)', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
              <Icon name="check" size={20} stroke={3} />
            </div>
            <div>
              <div style={{fontWeight: 700, fontSize: 15}}>Trade complete</div>
              <div style={{fontSize: 12, color: 'var(--fg-2)'}}>{isBuyer ? `${amount} USDT released to your wallet` : `${amount} paid · verification recorded`}</div>
            </div>
          </div>
        )}

        {/* Trade details */}
        <div className="card">
          <div style={{fontSize: 11, color: 'var(--fg-3)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 10}}>Trade details</div>
          <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12}}>
            <div><div style={{fontSize: 11, color: 'var(--fg-3)'}}>Amount</div><div className="mono" style={{fontSize: 18, fontWeight: 700, marginTop: 2}}>${amount}<span style={{fontSize: 12, color: 'var(--fg-2)', marginLeft: 4}}>USDT</span></div></div>
            <div><div style={{fontSize: 11, color: 'var(--fg-3)'}}>Rate</div><div className="mono" style={{fontSize: 14, fontWeight: 600, marginTop: 2}}>₦{rate.toLocaleString()}</div></div>
            <div><div style={{fontSize: 11, color: 'var(--fg-3)'}}>Total</div><div className="mono" style={{fontSize: 18, fontWeight: 700, marginTop: 2, color: 'var(--fg-0)'}}>₦{totalFiat.toLocaleString()}</div></div>
            <div><div style={{fontSize: 11, color: 'var(--fg-3)'}}>Method</div><div style={{marginTop: 4}}><MethodChip method={vendor.methods[0]} /></div></div>
          </div>
        </div>

        {/* Counterparty */}
        <div className="card">
          <div style={{fontSize: 11, color: 'var(--fg-3)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 10}}>Counterparty</div>
          <div style={{display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12}}>
            <Avatar name={vendor.name} size={44} tier={vendor.tier} />
            <div style={{flex: 1}}>
              <div style={{fontWeight: 600, fontSize: 15}}>{vendor.name}</div>
              <div style={{fontSize: 12, color: 'var(--fg-2)', marginTop: 2}}>{vendor.completion}% completion · {vendor.trades.toLocaleString()} trades</div>
            </div>
          </div>
          <VerBadge tier={vendor.tier} count={vendor.ver} size="md" />
          <div style={{marginTop: 14, padding: 12, borderRadius: 10, background: 'rgba(91,60,136,0.10)', border: '1px solid rgba(91,60,136,0.22)'}}>
            <div style={{fontSize: 11, color: 'var(--violet-400)', fontWeight: 600, marginBottom: 6, textTransform: 'uppercase', letterSpacing: '0.04em'}}>Vendor terms</div>
            <div style={{fontSize: 13, color: 'var(--fg-1)'}}>{vendor.terms}</div>
          </div>
        </div>

        {/* Payment details — buyer */}
        {isBuyer && (state === 'active' || state === 'paid' || state === 'verified' || state === 'complete') && (
          <div className="card" style={{borderColor: state === 'active' ? 'rgba(201,147,46,0.35)' : 'var(--border-1)'}}>
            <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12}}>
              <div style={{fontSize: 11, color: 'var(--fg-3)', textTransform: 'uppercase', letterSpacing: '0.06em'}}>Send ₦{totalFiat.toLocaleString()} to</div>
              <span style={{fontSize: 11, padding: '2px 8px', borderRadius: 6, background: 'var(--success-bg)', color: 'var(--success)', border: '1px solid rgba(16,185,129,0.3)'}}>
                <Icon name="shield-check" size={10} /> Verified account
              </span>
            </div>
            <div style={{padding: 14, background: 'var(--bg-1)', borderRadius: 10, border: '1px solid var(--border-1)', display: 'flex', flexDirection: 'column', gap: 10}}>
              <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                <div>
                  <div style={{fontSize: 11, color: 'var(--fg-3)'}}>Account name</div>
                  <div style={{fontWeight: 600}}>{vendor.methodName}</div>
                </div>
                <CopyButton text={vendor.methodName} label="" />
              </div>
              <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                <div>
                  <div style={{fontSize: 11, color: 'var(--fg-3)'}}>Account number ({vendor.methods[0]})</div>
                  <div className="mono" style={{fontWeight: 600, fontSize: 15}}>8103 442 091</div>
                </div>
                <CopyButton text="8103442091" label="" />
              </div>
              <div style={{fontSize: 11, color: 'var(--fg-3)', display: 'flex', alignItems: 'center', gap: 6}}>
                <Icon name="info" size={12} />
                Verified by 47 users as {vendor.methodName}'s registered account
              </div>
            </div>
          </div>
        )}

        {/* Vendor view — payment received & verify ID */}
        {!isBuyer && state === 'paid' && (
          <div className="card" style={{borderColor: 'rgba(201,147,46,0.35)'}}>
            <div style={{fontSize: 11, color: 'var(--fg-3)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: 10}}>Identity verification required</div>
            <div style={{padding: 14, background: 'var(--bg-1)', borderRadius: 10, border: '1px solid var(--border-1)', marginBottom: 12}}>
              <div style={{fontSize: 11, color: 'var(--fg-3)'}}>Buyer declared name</div>
              <div style={{fontWeight: 700, fontSize: 18, marginTop: 2}}>Adaeze Okeke</div>
              <div style={{fontSize: 12, color: 'var(--fg-2)', marginTop: 6}}>Confirm this matches the sender name on your bank notification.</div>
            </div>
            <div style={{display: 'flex', alignItems: 'center', gap: 12, padding: 12, background: 'var(--bg-1)', borderRadius: 10, border: '1px dashed var(--border-2)', marginBottom: 12}}>
              <div style={{width: 56, height: 72, borderRadius: 6, background: 'var(--bg-3)', border: '1px solid var(--border-2)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--fg-3)', flexShrink: 0}}>
                <Icon name="user" size={20} />
              </div>
              <div style={{flex: 1, minWidth: 0}}>
                <div style={{fontSize: 13, fontWeight: 600}}>NIN slip uploaded</div>
                <div style={{fontSize: 11, color: 'var(--fg-2)'}}>First-time buyer · sensitive fields redacted</div>
              </div>
              <button className="btn btn-outline btn-sm">View</button>
            </div>
            <button className="btn btn-purple btn-full" onClick={() => setVerifyOpen(true)}>
              <Icon name="shield-check" size={16} /> Verify Identity
            </button>
          </div>
        )}

        {/* Chat */}
        <TradeChat messages={messages} onSend={sendMsg} vendor={vendor} />

        {/* Actions */}
        <div style={{display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 4}}>
          {isBuyer && state === 'opened' && (
            <button className="btn btn-outline" style={{flex: 1}} onClick={onCancel}>Cancel Trade</button>
          )}
          {isBuyer && state === 'active' && (
            <>
              <button className="btn btn-outline" onClick={onCancel}>Cancel</button>
              <button className="btn btn-brand" style={{flex: 1}} onClick={() => { onAdvance('paid'); if (toast) toast('Marked as paid. Waiting for vendor.', 'success'); }}>
                <Icon name="check" size={16} /> I Have Paid
              </button>
            </>
          )}
          {!isBuyer && state === 'opened' && (
            <>
              <button className="btn btn-outline" onClick={onCancel}>Decline</button>
              <button className="btn btn-brand" style={{flex: 1}} onClick={() => { onAdvance('active'); if (toast) toast('Trade accepted. Waiting for buyer payment.', 'success'); }}>Accept Trade</button>
            </>
          )}
          {(state === 'paid' || state === 'verified') && (
            <button className="btn btn-outline" style={{color: 'var(--error)', borderColor: 'rgba(239,68,68,0.3)'}} onClick={onDispute}>
              <Icon name="flag" size={14} /> File Dispute
            </button>
          )}
          {state === 'complete' && (
            <button className="btn btn-purple btn-full" onClick={onBack}>Back to marketplace</button>
          )}
        </div>
      </div>

      <Modal open={verifyOpen} onClose={()=>setVerifyOpen(false)} title="Verify buyer identity">
        <p style={{margin: '0 0 16px', color: 'var(--fg-1)', fontSize: 14}}>You are confirming that <strong style={{color: 'var(--fg-0)'}}>Adaeze Okeke</strong> matches the payment sender name on your bank notification.</p>
        <p style={{margin: '0 0 20px', color: 'var(--fg-2)', fontSize: 13}}>This verification will be recorded on the buyer's profile and visible to other vendors.</p>
        <div style={{display: 'flex', gap: 8}}>
          <button className="btn btn-outline" style={{flex: 1}} onClick={()=>setVerifyOpen(false)}>Cancel</button>
          <button className="btn btn-brand" style={{flex: 1}} onClick={() => { setVerifyOpen(false); onAdvance('complete'); toast && toast('Verified & released · ' + amount + ' USDT sent to buyer', 'success'); }}>
            Verify & Release
          </button>
        </div>
      </Modal>
    </div>
  );
};

Object.assign(window, { TradePage, TradeStatus });

</script>

  const [email, setEmail] = useStateW('');
  const [joined, setJoined] = useStateW(false);
  return (
    <div className="fade-in" style={{maxWidth: 520}}>
      <PageHeader title="Versrr API" subtitle="Coming soon" />
      <div className="card" style={{textAlign: 'center', padding: 32}}>
        <div style={{display: 'flex', justifyContent: 'center', marginBottom: 16}}>
          <div style={{width: 72, height: 72, borderRadius: 20, background: 'rgba(91,60,136,0.14)', border: '1px solid rgba(91,60,136,0.35)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--violet-400)'}}><Icon name="zap" size={32} /></div>
        </div>
        <h2 style={{margin: 0, fontSize: 22, fontWeight: 700}}>Automate your trades</h2>
        <p style={{color: 'var(--fg-2)', fontSize: 14, maxWidth: 360, margin: '8px auto 20px'}}>Monitor, respond and integrate Versrr into your workflow. Join the waitlist to be first.</p>
        {joined ? (
          <div style={{padding: 14, borderRadius: 10, background: 'var(--success-bg)', color: 'var(--success)', fontSize: 14, fontWeight: 500}}>
            ✓ You're on the list. We'll notify you when the API launches.
          </div>
        ) : (
          <div style={{display: 'flex', gap: 8}}>
            <input className="input" placeholder="your@email.com" value={email} onChange={e=>setEmail(e.target.value)} />
            <button className="btn btn-purple" onClick={()=>setJoined(true)}>Join Waitlist</button>
          </div>
        )}
        <div style={{marginTop: 28, display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: 10}}>
          {[
            { icon: 'refresh', t: 'Monitor trades' },
            { icon: 'zap', t: 'Automate responses' },
            { icon: 'api', t: 'Read offer data' },
            { icon: 'bell', t: 'Webhooks' },
          ].map(f => (
            <div key={f.t} style={{padding: 14, background: 'var(--bg-1)', borderRadius: 10, textAlign: 'left', border: '1px solid var(--border-1)'}}>
              <Icon name={f.icon} size={16} />
              <div style={{fontSize: 13, fontWeight: 500, marginTop: 8}}>{f.t}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ---------- Dispute ----------
const DisputePage = ({ onBack, toast }) => {
  const [reason, setReason] = useStateW('payment');
  const [desc, setDesc] = useStateW('');
  return (
    <div className="fade-in" style={{maxWidth: 560}}>
      <PageHeader title="File Dispute" subtitle="Open a formal review of this trade" back={onBack} />
      <div className="card" style={{display: 'flex', flexDirection: 'column', gap: 14}}>
        <label className="field">Reason
          <select className="input" value={reason} onChange={e=>setReason(e.target.value)}>
            <option value="payment">Payment not received</option>
            <option value="wrong">Wrong amount</option>
            <option value="unresponsive">Unresponsive counterparty</option>
            <option value="suspicious">Suspicious activity</option>
            <option value="other">Other</option>
          </select>
        </label>
        <label className="field">Description<textarea className="input" rows={4} placeholder="Describe what happened, with timestamps." value={desc} onChange={e=>setDesc(e.target.value)} /></label>
        <div style={{padding: 14, border: '1px dashed var(--border-2)', borderRadius: 10, textAlign: 'center', color: 'var(--fg-3)', fontSize: 13}}>
          <Icon name="upload" size={18} /><div style={{marginTop: 6}}>Drop screenshots or click to upload</div>
          <div style={{fontSize: 11, marginTop: 2}}>Max 5 files · 10MB each</div>
        </div>
        <div style={{padding: 12, background: 'rgba(239,68,68,0.06)', border: '1px solid rgba(239,68,68,0.2)', borderRadius: 10, fontSize: 12, color: 'var(--fg-1)', display: 'flex', gap: 8}}>
          <Icon name="alert" size={14} />Filing a false dispute may result in account restrictions.
        </div>
        <button className="btn btn-red btn-full" onClick={() => { toast && toast('Dispute submitted. Admin will review within 24h.', 'info'); onBack(); }}>Submit Dispute</button>
      </div>
    </div>
  );
};

Object.assign(window, { WalletPage, DepositPage, WithdrawPage, ProfilePage, SettingsPage, AuthPage, APIPage, DisputePage, MyOffersPage, HelpPage, LegalPage, ReferralPage });

</script>

<script type="text/babel" data-file="src/app.jsx" data-plugins="transform-react-jsx-source" data-filename="inline-6">
const { useState: useStateA, useEffect: useEffectA } = React;

// Tweaks — live-tweakable defaults
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "brand",
  "density": "comfortable",
  "showVerificationOnCards": true,
  "glowCTA": true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweaks] = useStateA(TWEAK_DEFAULTS);
  const [editMode, setEditMode] = useStateA(false);
  const [theme, setTheme] = useStateA(() => {
    try { return localStorage.getItem('vsr_theme') || 'dark'; } catch(e) { return 'dark'; }
  });
  useEffectA(() => {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('vsr_theme', theme); } catch(e) {}
  }, [theme]);
  const toggleTheme = () => setTheme(t => t === 'dark' ? 'light' : 'dark');
  const [auth, setAuth] = useStateA(() => {
    try { return localStorage.getItem('vsr_auth') === '1'; } catch(e) { return false; }
  });
  const [authMode, setAuthMode] = useStateA('login');
  const [route, setRoute] = useStateA(() => {
    try { return JSON.parse(localStorage.getItem('vsr_route')) || { page: 'p2p' }; } catch(e) { return { page: 'p2p' }; }
  });
  const [trade, setTrade] = useStateA(null);
  const [notifOpen, setNotifOpen] = useStateA(false);
  const { show, ToastHost } = useToast();

  useEffectA(() => { try { localStorage.setItem('vsr_route', JSON.stringify(route)); } catch(e) {} }, [route]);
  useEffectA(() => { try { localStorage.setItem('vsr_auth', auth ? '1' : '0'); } catch(e) {} }, [auth]);

  // Edit mode protocol
  useEffectA(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setEditMode(true);
      if (e.data?.type === '__deactivate_edit_mode') setEditMode(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const updateTweak = (k, v) => {
    setTweaks(t => {
      const next = { ...t, [k]: v };
      try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*'); } catch(e) {}
      return next;
    });
  };

  const go = (page, extra = {}) => setRoute({ page, ...extra });

  // Guest login modal (shown on trade actions if not authed)
  const [loginPrompt, setLoginPrompt] = useStateA(false);
  const requireAuth = (fn) => { if (auth) fn(); else setLoginPrompt(true); };

  const handleMenuAction = (id) => {
    if (id === 'logout') { setAuth(false); go('p2p'); return; }
    const gatedRoutes = ['offers', 'referral', 'profile'];
    if (!auth && gatedRoutes.includes(id)) { setLoginPrompt(true); return; }
    go(id);
  };

  const openTrade = (vendor, direction, amount = 100) => {
    setTrade({ vendor, direction, amount, state: 'opened' });
    setRoute({ page: 'trade', role: 'buyer' });
  };

  const advance = (newState) => setTrade(t => ({ ...t, state: newState }));

  const unread = VERSRR_DATA.notifications.filter(n => n.unread).length;

  const renderPage = () => {
    switch (route.page) {
      case 'p2p': return <P2PPage onOpenTrade={(v,d) => requireAuth(() => openTrade(v, d))} onCreate={() => requireAuth(() => go('p2p-create'))} />;
      case 'p2p-create': return <CreateOfferPage onBack={() => go('p2p')} onPublish={() => { show('Offer published', 'success'); go('p2p'); }} />;
      case 'trade': return <TradePage
          trade={trade}
          role={route.role || 'buyer'}
          onBack={() => go('p2p')}
          onAdvance={advance}
          onCancel={() => { show('Trade cancelled'); go('p2p'); }}
          onDispute={() => go('dispute')}
          toast={show}
        />;
      case 'dispute': return <DisputePage onBack={() => go('trade')} toast={show} />;
      case 'lk': return <LKPage onCreate={() => go('lk-create')} onOpen={(lk) => go('lk-manage', { lk })} onOpenPublic={(lk) => go('lk-public', { lk })} />;
      case 'lk-create': return <CreateLKPage onBack={() => go('lk')} onCreated={(code) => go('lk-public', { lk: { code, rate: 1617, note: 'Just created' } })} />;
      case 'lk-public': return <LKPublicPage lk={route.lk} onBack={() => go('lk')} onOpenTrade={(v, amt) => requireAuth(() => openTrade(v, 'buy', amt))} />;
      case 'lk-manage': return <LKPage onCreate={() => go('lk-create')} onOpen={() => {}} onOpenPublic={(lk) => go('lk-public', { lk })} />;
      case 'hw': return <HWPage onCreate={() => go('hw-create')} onOpen={(l) => go('hw-detail', { listing: l })} />;
      case 'hw-create': return <CreateHWPage onBack={() => go('hw')} onPost={() => { show('Listing posted. Vendors are being notified.', 'success'); go('hw'); }} />;
      case 'hw-detail': return <HWDetailPage listing={route.listing} onBack={() => go('hw')} toast={show} />;
      case 'wallet': return <WalletPage onDeposit={() => go('wallet-deposit')} onWithdraw={() => go('wallet-withdraw')} />;
      case 'wallet-deposit': return <DepositPage onBack={() => go('wallet')} toast={show} />;
      case 'wallet-withdraw': return <WithdrawPage onBack={() => go('wallet')} toast={show} />;
      case 'api': return <APIPage />;
      case 'offers': return <MyOffersPage onCreateOffer={() => go('p2p-create')} />;
      case 'help': return <HelpPage onBack={() => go('p2p')} />;
      case 'legal': return <LegalPage onBack={() => go('p2p')} />;
      case 'referral': return <ReferralPage onBack={() => go('p2p')} />;
      case 'profile': return <ProfilePage onBack={() => go('p2p')} onSettings={() => go('settings')} onReferral={() => go('referral')} />;
      case 'settings': return <SettingsPage onBack={() => go('profile')} />;
      default: return <P2PPage onOpenTrade={openTrade} onCreate={() => go('p2p-create')} />;
    }
  };

  const activeTab = route.page.startsWith('p2p') || route.page === 'trade' || route.page === 'dispute' ? 'p2p'
    : route.page.startsWith('lk') ? 'lk'
    : route.page.startsWith('hw') ? 'hw'
    : route.page.startsWith('wallet') ? 'wallet'
    : route.page === 'offers' ? 'offers'
    : 'p2p';

  return (
    <div className="app-shell" data-screen-label="Versrr App" style={tweaks.density === 'compact' ? { fontSize: 13 } : {}}>
      <TopBar
        onProfile={() => auth ? go('profile') : setLoginPrompt(true)}
        onBell={() => auth ? setNotifOpen(true) : setLoginPrompt(true)}
        unread={auth ? unread : 0}
        onHome={() => go('p2p')}
        theme={theme}
        onToggleTheme={toggleTheme}
        onMenuAction={handleMenuAction}
        isGuest={!auth}
      />
      <Sidebar active={activeTab} onChange={(t) => go(t)} theme={theme} />
      <main className="main">
        {/* Guest banner */}
        {!auth && (
          <div style={{marginBottom: 16, padding: '10px 16px', background: 'var(--info-bg)', border: '1px solid rgba(91,60,136,0.35)', borderRadius: 12, display: 'flex', alignItems: 'center', gap: 12}}>
            <Icon name="info" size={16} />
            <span style={{flex: 1, fontSize: 13}}>You're browsing as a guest. <button onClick={() => setLoginPrompt(true)} style={{color: 'var(--brand-400)', fontWeight: 600, textDecoration: 'underline', cursor: 'pointer'}}>Sign in</button> to start trading.</span>
            <button onClick={() => setLoginPrompt(true)} className="btn btn-brand btn-sm">Log in / Sign up</button>
          </div>
        )}
        {renderPage()}
      </main>
      <BottomNav active={activeTab} onChange={(t) => go(t)} theme={theme} />
      <ToastHost />

      {/* Login prompt modal for guests */}
      <Modal open={loginPrompt} onClose={() => setLoginPrompt(false)} title="Sign in to trade" size="sm">
        <p style={{margin: '0 0 16px', fontSize: 13, color: 'var(--fg-2)'}}>You can browse Versrr freely. Create an account or sign in to open trades, deposit funds, and verify your identity.</p>
        <div style={{display: 'flex', flexDirection: 'column', gap: 8}}>
          <button className="btn btn-brand btn-full" onClick={() => { setLoginPrompt(false); setAuthMode('signup'); setAuth(true); show('Welcome to Versrr!', 'success'); }}>
            <Icon name="user" size={16}/> Create free account
          </button>
          <button className="btn btn-outline btn-full" onClick={() => { setLoginPrompt(false); setAuthMode('login'); setAuth(true); show('Welcome back!', 'success'); }}>
            Sign in
          </button>
        </div>
        <p style={{margin: '12px 0 0', fontSize: 11, color: 'var(--fg-3)', textAlign: 'center'}}>By continuing you agree to our Terms of Service and Privacy Policy.</p>
      </Modal>

      <Modal open={notifOpen} onClose={() => setNotifOpen(false)} title="Notifications">
        <div style={{display: 'flex', flexDirection: 'column', gap: 8}}>
          {VERSRR_DATA.notifications.map(n => (
            <div key={n.id} style={{padding: 12, borderRadius: 10, background: n.unread ? 'var(--info-bg)' : 'var(--bg-1)', border: '1px solid var(--border-1)', display: 'flex', gap: 10, alignItems: 'flex-start'}}>
              <div style={{width: 32, height: 32, borderRadius: 8, background: 'var(--bg-3)', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
                <Icon name={n.kind === 'bid' ? 'gift' : n.kind === 'verify' ? 'shield-check' : 'store'} size={14} />
              </div>
              <div style={{flex: 1}}>
                <div style={{fontSize: 13}}>{n.msg}</div>
                <div style={{fontSize: 11, color: 'var(--fg-3)', marginTop: 2}}>{n.when}</div>
              </div>
              {n.unread && <span style={{width: 8, height: 8, borderRadius: 999, background: 'var(--brand-700)', marginTop: 6}} />}
            </div>
          ))}
        </div>
      </Modal>

      {/* Tweaks panel */}
      {editMode && (
        <div style={{
          position: 'fixed', bottom: 88, right: 16, zIndex: 50,
          background: 'var(--bg-2)', border: '1px solid var(--border-2)', borderRadius: 14,
          padding: 16, width: 260,
          boxShadow: 'var(--shadow-lg)',
          display: 'flex', flexDirection: 'column', gap: 12,
        }}>
          <div style={{display: 'flex', alignItems: 'center', gap: 8}}>
            <Icon name="settings" size={16} />
            <div style={{fontWeight: 600, fontSize: 14}}>Tweaks</div>
          </div>
          <div>
            <div style={{fontSize: 11, color: 'var(--fg-3)', textTransform: 'uppercase', marginBottom: 6}}>CTA Accent</div>
            <Segmented full value={tweaks.accent} onChange={(v) => updateTweak('accent', v)} options={[{value:'brand',label:'Brand'},{value:'sell',label:'Sell accent'},{value:'buy',label:'Buy accent'}]} />
          </div>
          <div>
            <div style={{fontSize: 11, color: 'var(--fg-3)', textTransform: 'uppercase', marginBottom: 6}}>Density</div>
            <Segmented full value={tweaks.density} onChange={(v) => updateTweak('density', v)} options={[{value:'comfortable',label:'Comfortable'},{value:'compact',label:'Compact'}]} />
          </div>
          <div style={{borderTop: '1px solid var(--border-1)', paddingTop: 12, display: 'flex', flexDirection: 'column', gap: 8}}>
            <div style={{fontSize: 11, color: 'var(--fg-3)', textTransform: 'uppercase'}}>Jump to trade state</div>
            {['opened','active','paid','complete'].map(s => (
              <button key={s} className="btn btn-outline btn-sm" onClick={() => { if (!trade) setTrade({ vendor: VERSRR_DATA.vendors[0], direction: 'buy', amount: 100, state: s }); else advance(s); go('trade', { role: 'buyer' }); }}>
                Buyer · {s}
              </button>
            ))}
            <button className="btn btn-outline btn-sm" onClick={() => { setTrade({ vendor: VERSRR_DATA.vendors[0], direction: 'buy', amount: 100, state: 'paid' }); go('trade', { role: 'vendor' }); }}>
              Vendor view · paid (verify ID)
            </button>
            <button className="btn btn-outline btn-sm" onClick={() => setAuth(false)}>Sign out (see auth)</button>
          </div>
        </div>
      )}

      {/* accent style override via tweak */}
      <style>{tweaks.accent === 'buy' ? `
        .btn-brand { background: var(--buy-500) !important; color: #fff !important; }
        .btn-brand:hover { background: var(--buy-600) !important; }
      ` : tweaks.accent === 'sell' ? `
        .btn-brand { background: var(--sell-500) !important; color: #fff !important; }
        .btn-brand:hover { background: var(--sell-600) !important; }
      ` : ''}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>



</body></html>
